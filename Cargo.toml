[package]
name = "stripchart"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[features]
default = ["gui"]
# The windowed recorder, stripchartw.
gui = ["dep:eframe", "dep:winit"]

[[bin]]
name = "stripchart"
path = "src/main.rs"

[[bin]]
name = "stripchartw"
path = "src/bin/stripchartw/main.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Lets stripchartw pick X11 over Wayland under WSLg.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", optional = true, default-features = false, features = ["x11"] }
